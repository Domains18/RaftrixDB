syntax = "proto3";

package kvstore.v1;

option go_package = "github.com/Domains18/RaftrixDB.git/proto/kvstore/v1;kvstorev1";

// ── Client-facing KV API ──────────────────────────────────────────────────

service KVService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc CompareAndSwap(CASRequest) returns (CASResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
}

message GetRequest  { string key = 1; }
message GetResponse { string key = 1; bytes value = 2; bool found = 3; }

message PutRequest  { string key = 1; bytes value = 2; }
message PutResponse { bool ok = 1; }

message DeleteRequest { string key = 1; }
message DeleteResponse { bool ok = 1; }

message CASRequest  { string key = 1; bytes prev_value = 2; bytes new_value = 3; }
message CASResponse { bool ok = 1; string error = 2; }

message ScanRequest  { string prefix = 1; }
message ScanResponse { map<string, bytes> keys = 1; }

// ── Raft internal RPCs ────────────────────────────────────────────────────

service RaftService {
  rpc AppendEntries(AppendEntriesRequest)     returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest)         returns (RequestVoteResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

message LogEntry {
  uint64 index = 1;
  uint64 term  = 2;
  Command command = 3;
}

message Command {
  string op         = 1;
  string key        = 2;
  bytes  value      = 3;
  bytes  prev_value = 4;
}

message AppendEntriesRequest {
  uint64         term           = 1;
  string         leader_id      = 2;
  uint64         prev_log_index = 3;
  uint64         prev_log_term  = 4;
  repeated LogEntry entries     = 5;
  uint64         leader_commit  = 6;
}

message AppendEntriesResponse {
  uint64 term           = 1;
  bool   success        = 2;
  string follower_id    = 3;
  uint64 match_index    = 4;
  uint64 conflict_index = 5;
  uint64 conflict_term  = 6;
}

message RequestVoteRequest {
  uint64 term           = 1;
  string candidate_id   = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term  = 4;
}

message RequestVoteResponse {
  uint64 term          = 1;
  bool   vote_granted  = 2;
  string voter_id      = 3;
}

message InstallSnapshotRequest {
  uint64 term                = 1;
  string leader_id           = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term  = 4;
  bytes  data                = 5;
}

message InstallSnapshotResponse {
  uint64 term        = 1;
  string follower_id = 2;
  bool   success     = 3;
}
